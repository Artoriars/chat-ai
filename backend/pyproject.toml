[project]
name = "chatbi-backend"
version = "0.1.0"
description = "Chat BI backend (M3: schema collect -> NL2SQL -> secure execute -> self-heal -> route/export)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=42",        # pymysql 连 MySQL8.4 caching_sha2_password 必需
    "sqlglot>=25",
    "pydantic-settings>=2",
    "python-dotenv>=1.0",      # .env 导出 OS 环境（langsmith 开关依赖）
    "openpyxl>=3.1",           # M3: Excel 导出（流式 write_only）
    "redis>=5",                # M3: 导出队列 / 任务状态 / QA 去重
    "langsmith>=0.1",          # M3: question-SQL 沉淀（langchain 已传递依赖，显式声明）
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
